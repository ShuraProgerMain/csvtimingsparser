name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cgo: "0"
          - os: macos-latest
            cgo: "1"
          - os: ubuntu-latest
            cgo: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Linux GUI (webview_go) needs GTK3 + WebKit. webview_go asks pkg-config
      # for webkit2gtk-4.0, but Ubuntu 24.04 only ships 4.1 (API-compatible), so
      # we add a tiny .pc shim that redirects 4.0 -> 4.1.
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          mkdir -p "$HOME/pcshim"
          cat > "$HOME/pcshim/webkit2gtk-4.0.pc" <<'PC'
          Name: webkit2gtk-4.0
          Description: shim redirecting webkit2gtk-4.0 to 4.1
          Version: 2.44.0
          Requires: webkit2gtk-4.1
          PC
          echo "PKG_CONFIG_PATH=$HOME/pcshim:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Vet
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go vet ./...

      - name: Test
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build ./...
